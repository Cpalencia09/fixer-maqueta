<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>Fixer Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: columna móvil (shell) centrada; cabecera degradada, contenido con scroll y barra inferior fija dentro del shell. */
:root {
  --bg: #f3f5f8;
  --stage: #dfe6ee;
  --card: #ffffff;
  --ink: #14284b;
  --muted: #6b7a90;
  --line: #e3e8ef;
  --btn: #1d3b63;
  --btn-ink: #ffffff;
  --teal: #2a8f8f;
  --teal-soft: #e1f0f0;
  --grad: linear-gradient(135deg, #1f4a73 0%, #25788a 60%, #2a9090 100%);
  --ok: #12a77a;
  --warn: #b7791f;
  --warn-soft: #fdf1d6;
  --danger: #d92d20;
  --danger-soft: #fdecea;
  --shadow: 0 1px 2px rgba(20, 40, 75, .05), 0 6px 18px rgba(20, 40, 75, .06);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a27; --stage: #08111a; --card: #152638; --ink: #e8eef7; --muted: #93a4ba; --line: #243850;
    --btn: #3578b3; --teal: #4fb8b8; --teal-soft: #17404a;
    --grad: linear-gradient(135deg, #17375a 0%, #1c5b6d 60%, #1f7377 100%);
    --warn: #f2c14e; --warn-soft: #3a2f13; --danger: #ff6b5e; --danger-soft: #3b1b1a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a27; --stage: #08111a; --card: #152638; --ink: #e8eef7; --muted: #93a4ba; --line: #243850;
  --btn: #3578b3; --teal: #4fb8b8; --teal-soft: #17404a;
  --grad: linear-gradient(135deg, #17375a 0%, #1c5b6d 60%, #1f7377 100%);
  --warn: #f2c14e; --warn-soft: #3a2f13; --danger: #ff6b5e; --danger-soft: #3b1b1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.stage { height: 100%; display: flex; justify-content: center; align-items: center; }
.shell { position: relative; width: 100%; max-width: 440px; height: 100%; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 520px) {
  .stage { padding: 20px 0; }
  .shell { height: min(900px, 100%); border-radius: 34px; box-shadow: 0 30px 80px rgba(10, 25, 45, .28); border: 1px solid var(--line); }
}
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-inline: 20px; padding-bottom: 28px; scroll-behavior: smooth; }
.view.nopad { padding-inline: 0; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.teal { color: var(--teal); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* logo */
.logo { position: relative; display: inline-block; font-weight: 800; letter-spacing: -.04em; color: var(--btn); line-height: 1; }
.logo svg { position: absolute; left: 36%; top: -.42em; width: .42em; height: .42em; color: var(--teal); stroke-width: 2.4; }
.logo.sm { font-size: 30px; }
.logo.lg { font-size: 36px; }
.logo.white { color: #fff; }
.logo.white svg { color: #7fd6d3; }
body .on-grad .logo { color: #fff; }
.tagline { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--btn); margin-top: 10px; }
.on-grad .tagline { color: rgba(255,255,255,.82); }

/* pills / chips */
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 99px; background: var(--teal-soft); font-weight: 700; font-size: 14px; color: var(--btn); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.pill.white { background: #fff; color: #1d3b63; }
.pill.glass { background: rgba(255,255,255,.92); color: #1d3b63; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; background: var(--teal-soft); color: var(--btn); }
.tag.pro { background: var(--warn-soft); color: var(--warn); }
.tag.h24 { background: #e7e9fb; color: #4f46c7; }
.tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.h24 { background: #26285a; color: #aab0ff; } }
:root[data-theme="dark"] .tag.h24 { background: #26285a; color: #aab0ff; }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border-radius: 16px; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 17px; transition: transform .12s, opacity .15s; }
.btn:active { transform: scale(.985); }
.btn:disabled { background: #8497b0; opacity: .85; cursor: not-allowed; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.sm { height: 44px; font-size: 15px; border-radius: 14px; width: auto; padding: 0 18px; }
.btn.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
.btn.teal { background: var(--teal); color: #fff; }

/* landing */
.landing-top { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 44px; }
.hero h1 { font-size: 40px; letter-spacing: -.04em; line-height: 1.08; margin-top: 26px; }
.hero p.lead { font-size: 17px; color: var(--muted); margin-top: 18px; line-height: 1.55; }
.badges3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; }
.badge3 { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 16px 8px; font-size: 13.5px; font-weight: 600; border-radius: 20px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
.badge3 svg { font-size: 26px; color: var(--teal); }
.how { padding: 24px; margin-top: 24px; }
.how h3 { font-size: 19px; font-weight: 800; margin-bottom: 18px; }
.step { display: flex; gap: 16px; position: relative; padding-bottom: 20px; }
.step:last-child { padding-bottom: 0; }
.step .ic { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #1f4a73, #2a8f8f); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; z-index: 1; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 23px; top: 52px; bottom: 4px; width: 2px; background: var(--line); }
.step b { font-size: 18px; display: block; }
.step span { color: var(--muted); font-size: 15px; }
.roles-title { text-align: center; margin: 34px 0 14px; }
.role { display: flex; align-items: center; gap: 16px; padding: 18px; width: 100%; text-align: left; margin-bottom: 14px; transition: transform .12s; }
.role:active { transform: scale(.99); }
.role .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: var(--line); color: var(--btn); flex: none; }
.role .ic.t { background: var(--teal-soft); color: var(--teal); }
.role .tx { flex: 1; min-width: 0; }
.role b { font-size: 20px; letter-spacing: -.02em; display: block; }
.role span { color: var(--muted); }
.role > svg { font-size: 22px; color: var(--muted); }
.legal { text-align: center; color: var(--muted); margin: 24px 6px 8px; font-size: 14.5px; }
.legal a { color: var(--teal); font-weight: 600; cursor: pointer; }

/* auth */
.authwrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 28px 16px; }
.auth { padding: 36px 24px 28px; text-align: center; }
.auth h1 { font-size: 30px; margin-top: 30px; }
.auth .sub { color: var(--muted); font-size: 17px; margin: 10px 0 28px; }
.social { height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; font-weight: 600; font-size: 17px; margin-bottom: 12px; }
.social.apple { background: #000; color: #fff; border-color: #000; }
.or { display: flex; align-items: center; gap: 14px; color: var(--muted); margin: 18px 0 22px; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.field { text-align: left; margin-bottom: 18px; }
.field label, .lbl { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 16px; }
.lbl a { color: var(--teal); font-weight: 600; font-size: 14.5px; cursor: pointer; }
.input { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: inset 0 1px 2px rgba(20,40,75,.04); color: var(--muted); font-size: 17px; }
.input:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 22%, transparent); }
.input svg { font-size: 21px; }
.input input, .input select { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 17px; }
.input input::placeholder { color: var(--muted); opacity: .8; }
.input select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.input.area { height: auto; padding: 12px 16px; align-items: flex-start; }
.input textarea { flex: 1; border: 0; outline: 0; background: transparent; resize: none; min-height: 84px; color: var(--ink); font-size: 16px; }
.input .pre { font-weight: 700; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; margin: -8px 0 14px; text-align: left; font-weight: 600; }
.swap { margin-top: 26px; text-align: center; color: var(--muted); font-size: 17px; }
.swap a { color: var(--teal); font-weight: 700; cursor: pointer; }
.copyright { text-align: center; color: var(--muted); font-size: 14px; margin-top: 20px; }
.copyright b { color: var(--teal); }

/* onboarding */
.ob-head { background: var(--card); border-bottom: 1px solid var(--line); padding: 20px 20px 16px; padding-top: 18px; }
.ob-top { display: flex; align-items: center; justify-content: center; position: relative; height: 40px; }
.ob-top .back { position: absolute; left: -6px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 22px; }
.ob-meta { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 10px; font-weight: 700; }
.ob-meta .eyebrow { letter-spacing: .08em; font-size: 15px; }
.ob-meta .teal { font-size: 16px; }
.bars { display: flex; gap: 8px; }
.bars i { flex: 1; height: 7px; border-radius: 9px; background: var(--line); }
.bars i.on { background: var(--teal); }
.ob-body { padding-top: 34px; }
.ob-body .sub { color: var(--muted); font-size: 17px; margin: 10px 0 30px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-weight: 600; transition: all .15s; }
.chip.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.upl { display: flex; align-items: center; gap: 14px; padding: 16px; margin-bottom: 12px; width: 100%; text-align: left; }
.upl .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-size: 22px; }
.upl b { display: block; }
.upl span { color: var(--muted); font-size: 14px; }
.upl .st { margin-left: auto; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 20px; background: var(--line); transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch.on { background: var(--teal); }
.switch.on::after { transform: translateX(22px); }
.row { display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.sumrow { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sumrow:last-child { border: 0; }
.sumrow span:first-child { color: var(--muted); }
.sumrow span:last-child { font-weight: 700; text-align: right; min-width: 0; overflow-wrap: anywhere; }
.success { text-align: center; padding-top: 70px; }
.success .big { width: 92px; height: 92px; border-radius: 50%; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); display: grid; place-items: center; font-size: 48px; margin: 0 auto 26px; }

/* app header */
.hdr { background: var(--grad); color: #fff; padding: 26px 20px 22px; border-radius: 0 0 36px 36px; box-shadow: 0 12px 30px rgba(31, 74, 115, .3); margin-bottom: 20px; }
.hdr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hdr-top .tagline { font-size: 11.5px; }
.hdr h1 { font-size: 32px; margin-top: 26px; }
.hdr p { color: rgba(255,255,255,.85); font-size: 18px; margin-top: 6px; }
.hdr .rates { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.hdr .pill { font-size: 14.5px; padding: 8px 14px; }
.roundbtn { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; font-size: 22px; }
.searchbar { display: flex; align-items: center; gap: 14px; background: var(--card); color: var(--muted); border-radius: 20px; height: 68px; padding: 0 20px 0 14px; margin-top: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.14); }
.searchbar .sic { width: 46px; height: 46px; border-radius: 14px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-size: 23px; flex: none; }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; color: var(--ink); height: 100%; }
.searchbar input::placeholder { color: var(--muted); }
.searchbar > button { font-size: 22px; color: var(--ink); display: grid; place-items: center; width: 36px; height: 36px; }
.trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.trust .badge3 { flex-direction: column; font-size: 14.5px; padding: 18px 6px; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 14px; gap: 10px; }
.sec-head h2 { display: flex; align-items: center; gap: 10px; }
.sec-head h2 svg { color: var(--teal); font-size: 24px; }
.sec-head a, .sec-head .link { color: var(--teal); font-weight: 700; font-size: 16px; cursor: pointer; }
.sec-head .count { color: var(--muted); font-size: 15px; }
.rubros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.rubro { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 4px 16px; min-height: 134px; text-align: center; font-weight: 700; font-size: 15px; letter-spacing: -.01em; transition: transform .12s; min-width: 0; overflow-wrap: anywhere; }
.rubro:active { transform: scale(.97); }
.rubro .ri, .svc .ri { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 25px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); flex: none; }
.rubro span { padding-inline: 2px; }
.mapbox { position: relative; height: 270px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #e9e5dc; }
.mapbox svg.map { width: 100%; height: 100%; display: block; }
.mapbox .zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.mapbox .zoom button { width: 44px; height: 44px; font-size: 26px; font-weight: 700; color: #111; }
.mapbox .zoom button + button { border-top: 1px solid #ddd; }
.mapbox .gps { position: absolute; right: 10px; top: 10px; display: flex; align-items: center; gap: 9px; padding: 10px 16px; background: #fff; border-radius: 99px; font-weight: 700; color: #1d3b63; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.mapbox .gps svg { color: var(--teal); font-size: 20px; }
.mapbox .attr { position: absolute; right: 0; bottom: 0; background: rgba(255,255,255,.8); padding: 2px 8px; font-size: 12px; color: #333; }
.tech { display: flex; gap: 14px; padding: 16px; margin-bottom: 14px; width: 100%; text-align: left; transition: transform .12s; }
.tech:active { transform: scale(.992); }
.avatar { position: relative; width: 62px; height: 62px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 22px; flex: none; align-self: flex-start; }
.avatar .on { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--ok); border: 3px solid var(--card); }
.tech .info { flex: 1; min-width: 0; }
.tech .nm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.tech .nm svg { color: var(--btn); font-size: 19px; }
.tech .rb { color: var(--muted); margin: 2px 0 8px; font-size: 16px; }
.tech .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.tech .meta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 16px; }
.tech .meta .st { display: flex; align-items: center; gap: 6px; }
.tech .meta .st svg { color: #f5b301; fill: #f5b301; }
.tech .meta .lc { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.tech .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.tech .foot .t { display: flex; align-items: center; gap: 6px; }
.price b { font-size: 22px; color: var(--btn); letter-spacing: -.02em; }
.price span { color: var(--muted); font-size: 15px; margin-left: 6px; }
.conv { padding: 22px; margin-top: 8px; }
.conv .top { display: flex; justify-content: space-between; align-items: flex-start; }
.conv h3 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.conv .tasa { color: var(--muted); margin-top: 4px; }
.conv .tasa b { color: var(--teal); }
.conv .sw { width: 52px; height: 52px; border-radius: 16px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; font-size: 24px; }
.conv .lbl { margin: 22px 0 8px; font-size: 14px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.conv .input { background: var(--bg); }
.escrow { margin-top: 26px; padding: 24px; border-radius: 26px; background: var(--grad); color: #fff; box-shadow: 0 14px 32px rgba(31,74,115,.28); }
.escrow .h { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.escrow .h i { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 24px; }
.escrow p { margin: 16px 0; font-size: 18px; line-height: 1.5; color: rgba(255,255,255,.9); }
.escrow .flow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.escrow .flow span { background: rgba(255,255,255,.16); padding: 9px 16px; border-radius: 99px; font-weight: 600; }
.escrow .flow svg { opacity: .8; }

/* servicios */
.hdr.page .back { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 22px; color: #fff; }
.hdr.page h1 { margin-top: 28px; font-size: 36px; }
.svc { display: flex; gap: 16px; padding: 16px; margin-bottom: 14px; width: 100%; text-align: left; align-items: flex-start; transition: transform .12s; }
.svc:active { transform: scale(.992); }
.svc .ri { width: 62px; height: 62px; font-size: 28px; border-radius: 16px; }
.svc b { display: block; font-size: 19px; letter-spacing: -.02em; margin-bottom: 4px; }
.svc span { color: var(--muted); font-size: 16px; line-height: 1.45; }
.svc .tx { min-width: 0; flex: 1; }
.svc .n { font-size: 13px; font-weight: 700; color: var(--teal); background: var(--teal-soft); border-radius: 99px; padding: 3px 9px; margin-top: 8px; display: inline-block; }

    unsubReq.push(db.collection('solicitudes').where('tecnicoId', '==', S.uid).onSnapshot(function (s) { S.jobsDB = docsOf(s); render(); }, quiet));
    unsubReq.push(db.collection('tecnicos').onSnapshot(function (s) {
      S.techDB = s.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }).filter(function (x) { return x.id !== S.uid && x.online !== false && x.name; }).map(toTech);
      render();
    }, quiet));
  }
  function jobSt(id, st, msg) {
    db.collection('solicitudes').doc(id).update({ st: st }).then(function () { toast(msg); }).catch(function (e) { toast(fbMsg(e)); });
  }
  function jobView(j) {
    return { id: j.id, cliente: j.cliente || 'Cliente', rubro: (rub(j.tr) || {}).n || 'Servicio', z: j.tz || '', d: j.desc || 'Sin descripción.', amt: j.amt, st: j.st, code: j.code, rate: j.rate || 0, ts: j.ts || 0 };
  }
  function techHomeFB() {
    var first = S.user.name.split(' ')[0], jobs = S.jobsDB.map(jobView);
    var pend = S.techOnline ? jobs.filter(function (j) { return j.st === 'pendiente'; }) : [];
    var paid = jobs.filter(function (j) { return j.st === 'liberado'; }), rated = paid.filter(function (j) { return j.rate > 0; });
    var total = paid.reduce(function (a, j) { return a + j.amt; }, 0);
    var avg = rated.length ? (rated.reduce(function (a, j) { return a + j.rate; }, 0) / rated.length).toFixed(1) : '—';
    var n = jobs.filter(function (j) { return j.st === 'trabajando' || j.st === 'porliberar' || j.st === 'liberado'; }).length;
    return '<div class="view nopad"><div class="hdr"><div class="hdr-top"><div>' + LOGO('sm white') + '<div class="tagline" style="color:rgba(255,255,255,.8)">Panel de técnico</div></div><span class="pill glass"><i class="dot"></i>BCV Bs. ' + fmt(BCV) + '</span></div><h1>Hola, ' + esc(first) + '</h1><p>' + (S.techOnline ? 'Estás visible para clientes cercanos.' : 'Estás desconectado. No recibirás solicitudes.') + '</p></div>' +
      '<div style="padding-inline:20px"><div class="card" style="padding:18px"><div class="row"><div><b style="font-size:18px">' + (S.techOnline ? 'Disponible ahora' : 'No disponible') + '</b><div class="muted" style="font-size:14.5px">Activa para recibir solicitudes en tu zona</div></div><button class="switch' + (S.techOnline ? ' on' : '') + '" data-act="online" role="switch" aria-checked="' + S.techOnline + '" aria-label="Disponible"></button></div></div>' +
      '<div class="stat3" style="margin-top:14px"><div class="card stat"><b>' + usd(total).replace('.00', '') + '</b><span>Cobrado</span></div><div class="card stat"><b>' + n + '</b><span>Trabajos</span></div><div class="card stat"><b>' + avg + '</b><span>Calificación</span></div></div>' +
      '<div class="sec-head"><h2>Solicitudes nuevas</h2><span class="count">' + pend.length + ' pendientes</span></div>' +
      (pend.length ? pend.map(function (q) { return '<div class="card req"><div class="top"><div class="avatar" style="background:#2a7f9e">' + initials(q.cliente) + '</div><div class="tx"><b>' + esc(q.cliente) + '</b><span>' + esc(q.rubro) + (q.z ? ' · ' + esc(q.z) : '') + '</span></div><span class="price"><b>' + usd(q.amt) + '</b></span></div><p class="desc">«' + esc(q.d) + '»</p><div class="tag ok" style="margin-bottom:14px">' + ic('shieldOk') + 'Pago ya en custodia</div><div class="two"><button class="btn ghost sm" style="width:100%" data-act="decline" data-id="' + q.id + '">Rechazar</button><button class="btn sm" style="width:100%" data-act="accept" data-id="' + q.id + '">Aceptar</button></div></div>'; }).join('') : '<div class="card" style="padding:28px 20px;text-align:center"><div class="muted">' + (S.techOnline ? 'No tienes solicitudes pendientes. Cuando un cliente te contrate, aparecerá aquí.' : 'Activa tu disponibilidad para ver solicitudes.') + '</div></div>') + '</div></div>';
  }
  function techJobsFB() {
    var jobs = S.jobsDB.map(jobView).filter(function (j) { return j.st === 'trabajando' || j.st === 'porliberar' || j.st === 'liberado'; });
    return '<div class="view"><div class="page-h"><h1>Mis trabajos</h1><p>Marca como terminado y comparte el código con tu cliente.</p></div>' +
      (jobs.length ? jobs.map(function (j) {
        var tag = j.st === 'liberado' ? '<span class="tag ok">Pagado</span>' : j.st === 'porliberar' ? '<span class="tag">Terminado</span>' : '<span class="tag">En curso</span>';
        var act = j.st === 'trabajando' ? '<button class="btn sm" style="width:100%" data-act="finishJob" data-id="' + j.id + '">Marcar como terminado</button>' : j.st === 'porliberar' ? '<div class="codehint" style="background:var(--teal-soft);color:var(--btn)">Código de cierre para tu cliente: <b>' + j.code + '</b></div>' : '';
        return '<div class="card req"><div class="top"><div class="avatar" style="background:#2a7f9e">' + initials(j.cliente) + '</div><div class="tx"><b>' + esc(j.cliente) + '</b><span>' + esc(j.rubro) + (j.z ? ' · ' + esc(j.z) : '') + '</span></div>' + tag + '</div><p class="desc">«' + esc(j.d) + '»</p>' + act + '<div class="amount"><span class="muted">' + (j.st === 'liberado' ? 'Cobrado' : 'Pago en custodia') + '</span><span class="price"><b>' + usd(j.amt) + '</b></span></div></div>';
      }).join('') : '<div class="empty"><div class="ei">' + ic('inbox') + '</div><b>Sin trabajos en curso</b><p>Acepta una solicitud desde Inicio y aparecerá aquí.</p><button class="btn" data-act="tab" data-tab="inicio">Ver solicitudes</button></div>') + '</div>' + fab();
  }
  function ingresosFB() {
    var paid = S.jobsDB.map(jobView).filter(function (j) { return j.st === 'liberado'; }), total = paid.reduce(function (a, j) { return a + j.amt; }, 0);
    return '<div class="view"><div class="page-h"><h1>Ingresos</h1><p>Lo que has ganado con Fixer.</p></div>' +
      '<div class="bal"><div class="l">Total cobrado</div><div class="v">' + usd(total) + '</div><div class="s">≈ Bs. ' + fmt(total * BCV) + '</div></div>' +
      '<div class="sec-head"><h2>Movimientos</h2></div>' +
      (paid.length ? '<div class="card" style="padding:4px 18px">' + paid.map(function (e) { return '<div class="tx-row"><div class="ic">' + ic('wallet') + '</div><div class="tx"><b>' + esc(e.rubro) + ' · ' + esc(e.cliente) + '</b><span>' + new Date(e.ts).toLocaleDateString('es-VE') + '</span></div><span class="am">+' + usd(e.amt) + '</span></div>'; }).join('') + '</div>' : '<div class="card" style="padding:28px 20px;text-align:center"><div class="muted">Aún no has cobrado ningún trabajo. Se paga cuando tu cliente ingresa el código de cierre.</div></div>') +
      '</div>' + fab();
  }
  if (HAS_FB) {
    fbAuth.onAuthStateChanged(function (u) {
      unsubReq.forEach(function (f) { f(); }); unsubReq = [];
      if (!u) {
        var out = S.screen === 'loading' ? 'landing' : (S.screen === 'app' || S.screen === 'onboarding' || S.screen === 'done') ? 'auth' : S.screen;
        return go({ uid: null, requests: [], techDB: [], jobsDB: [], sheet: null, screen: out });
      }
      S.uid = u.uid;
      var ref = db.collection('users').doc(u.uid);
      ref.get().then(function (d) {
        var data = d.exists ? d.data() : null;
        var name = (data && data.name) || pendingName || u.displayName || (u.email || '').split('@')[0];
        var role = S.role || (data && data.role) || 'cliente';
        if (!data) return ref.set({ name: name, email: u.email, role: role, createdAt: Date.now() }, { merge: true }).then(function () { return [name, role]; });
        if (data.role !== role) ref.update({ role: role });
        return [name, role];
      }).then(function (r) {
        S.user = { name: r[0], email: u.email }; S.form.name = r[0]; S.role = r[1];
        listenReqs(); enterSession();
      }).catch(function (e) { go({ screen: 'auth', authErr: fbMsg(e) }); });
    });
  }
  function sendChat(text) {
    text = text.trim(); if (!text) return;
    S.chat.push({ r: 'u', x: text }); render();
    var n = norm(text), reply = 'Gracias por escribirnos. Un agente revisará tu consulta y te responderá en breve. Mientras tanto, puedes explorar los rubros en la pestaña Servicios.';
    BOT.some(function (b) { if (b[0].test(n)) { reply = b[1]; return true; } });
    setTimeout(function () { S.chat.push({ r: 'b', x: reply }); if (S.sheet && S.sheet.t === 'chat') render(); }, 700);
  }

  /* ---------- Eventos ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    if (t.classList.contains('scrim') && e.target !== t) return;
    var a = A[t.getAttribute('data-act')]; if (a) { e.preventDefault(); a(t.dataset, t); }
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'authForm') {
      var m = document.getElementById('aMail').value.trim(), p = document.getElementById('aPass').value, n = document.getElementById('aName');
      if (!/^\S+@\S+\.\S+$/.test(m)) return go({ authErr: 'Escribe un correo válido, por ejemplo tu@correo.com.' });
      if (p.length < 6) return go({ authErr: 'Tu contraseña debe tener al menos 6 caracteres.' });
      if (n && n.value.trim()) { S.user.name = n.value.trim(); S.form.name = n.value.trim(); }
      if (!HAS_FB) { S.user.email = m; S.authErr = ''; return enter(); }
      S.authErr = '';
      if (S.authMode === 'register') {
        if (!(n && n.value.trim())) return go({ authErr: 'Escribe tu nombre completo.' });
        pendingName = n.value.trim();
        var nm = pendingName;
        fbAuth.createUserWithEmailAndPassword(m, p).then(function (c) {
          return db.collection('users').doc(c.user.uid).set({ name: nm }, { merge: true });
        }).then(function () { S.user.name = nm; S.form.name = nm; render(); }).catch(function (er) { pendingName = null; go({ authErr: fbMsg(er) }); });
      } else {
        pendingName = null;
        fbAuth.signInWithEmailAndPassword(m, p).catch(function (er) { go({ authErr: fbMsg(er) }); });
      }
    } else if (e.target.id === 'homeSearch') {
      go({ tab: 'servicios', q: document.getElementById('hq').value, filterRubro: null });
    } else if (e.target.id === 'chatForm') {
      var i = document.getElementById('chatIn'), txt = i.value; i.value = ''; sendChat(txt); document.getElementById('chatIn').focus();
    }
  });
  app.addEventListener('input', function (e) {
    var el = e.target, id = el.id;
    if (el.dataset.f) {
      S.form[el.dataset.f] = el.value;
      var b = document.getElementById('obNext'); if (b) b.disabled = !obValid();
      var tb = document.getElementById('tarBs'); if (tb && el.dataset.f === 'tarifa') tb.textContent = '≈ Bs. ' + fmt((parseFloat(el.value) || 0) * BCV) + ' a tasa BCV';
    } else if (id === 'sq') { S.q = el.value; document.getElementById('svcList').innerHTML = svcList(); }
    else if (id === 'cUsd') { var v = parseFloat(el.value.replace(',', '.')); S.usdVal = el.value; S.bsVal = isNaN(v) ? '' : fmt(v * BCV); document.getElementById('cBs').value = S.bsVal; }
    else if (id === 'cBs') { var w = parseFloat(el.value.replace(/\./g, '').replace(',', '.')); S.bsVal = el.value; S.usdVal = isNaN(w) ? '' : (w / BCV).toFixed(2); document.getElementById('cUsd').value = S.usdVal; }
    else if (id === 'chatIn') { document.getElementById('chatSend').classList.toggle('on', !!el.value.trim()); }
  });
  app.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.f) { S.form[el.dataset.f] = el.value; var b = document.getElementById('obNext'); if (b) b.disabled = !obValid(); } });

  render();
})();
</script>

</body>
</html>
